name: 🤖 Hourly OpportunityHub Auto-Updater

on:
  schedule:
    # Run every single hour (at minute 0)
    - cron: '0 * * * *'
  workflow_dispatch:  # Allow manual trigger at any time from GitHub UI
  push:
    branches:
      - main
    paths:
      - 'automation/**'

concurrency:
  group: opportunityhub-auto-update
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

env:
  PYTHON_VERSION: '3.11'

jobs:
  update-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ─── 1. Setup ───
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: automation/requirements.txt

      - name: 📦 Install Python dependencies
        run: |
          pip install -r automation/requirements.txt

      # ─── 2. Run Scraping & README Generator Pipeline ───
      - name: 🚀 Run Multi-Tier Scraping & Sync Pipeline
        env:
          DRY_RUN: 'false'
          AUTO_COMMIT: 'false'
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        run: |
          python -m automation.pipeline

      # ─── 3. Commit & Push Updated Data & README ───
      - name: 📤 Auto-Commit Live Changes to Repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "OpportunityHub Bot"
          
          git add data/ README.md
          
          if git diff --staged --quiet; then
            echo "✅ Everything is already up-to-date — no new changes."
          else
            DATE=$(date -u +'%Y-%m-%d %H:%M UTC')
            git commit -m "🤖 Auto-update: ${DATE} — live multi-repo sync & README update"
            git push origin main
            echo "✅ Live updates pushed to GitHub!"
          fi
